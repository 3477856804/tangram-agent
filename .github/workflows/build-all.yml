name: build-all-platforms

# 全平台一键构建：Android APK/AAB、Windows x64、Linux x64、macOS(arm64)、iOS(未签名 ipa)、HarmonyOS(hap,尽力构建)。产物仓库只放安装包,不含任何源码。
# Flutter 3.50.0 一律从国内镜像 storage.flutter-io.cn 直装（GitHub 云 runner 拉
# storage.googleapis.com 常出现 HTTP/2 INTERNAL_ERROR）。
# 触发：Actions 面板 Run workflow（可勾选发布 Release），或 push 到 main。

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: '构建完成后发布 GitHub Release（可直接下载）'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-all.yml'
      - 'frontend/**'
      - 'scripts/**'

permissions:
  contents: write

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn
  FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

jobs:
  # ================= Android =================
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Install Flutter 3.50.0 (镜像直装)
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/flutter && sudo chown "$USER" /opt/flutter
          curl -fL -C - --max-time 600 --retry 5 --retry-all-errors -o /tmp/f.tar.xz \
            https://storage.flutter-io.cn/flutter_infra_release/releases/stable/linux/flutter_linux_3.50.0-stable.tar.xz
          tar -xJf /tmp/f.tar.xz -C /opt/flutter --strip-components=1
          echo /opt/flutter/bin >> "$GITHUB_PATH"
          /opt/flutter/bin/flutter --version
      - name: Android SDK 36
        run: |
          set -euo pipefail
          SDKM="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
      - name: Python 构建依赖 (pillow)
        run: |
          python3 -m pip install --quiet --upgrade pillow || python3 -m pip install --quiet --break-system-packages pillow
      - name: 签名还原与版本 bump（密钥仅存 CI Secret，仓库不落盘）
        working-directory: frontend/android
        run: |
          set -euo pipefail
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "缺少 Secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          mkdir -p keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore/tangram-release.jks
          chmod 600 keystore/tangram-release.jks
          printf 'storeFile=keystore/tangram-release.jks\nkeyAlias=tangram\n' > keystore.properties
          # 版本号真源 = 发布通道最新 Release 标签，自动进位（0.0.1→…→0.0.99→0.1.0）
          python3 - <<'EOF' | tee /tmp/bump.txt
          import json, urllib.request
          def latest():
              try:
                  r = urllib.request.urlopen(
                      "https://api.github.com/repos/3477856804/tangram-agent-releases/releases/latest",
                      timeout=20)
                  return json.load(r)["tag_name"].lstrip("v")
              except Exception:
                  return None
          v = latest()
          if v:
              major, minor, patch = (int(x) for x in v.split("."))
              patch += 1
              if patch > 99:
                  minor += 1; patch = 0
                  if minor > 99:
                      major += 1; minor = 0
          else:
              major, minor, patch = 0, 0, 1
          name = (f"{major}.{minor}.0" if patch == 0
                  else f"{major}.0.{patch}" if minor == 0
                  else f"{major}.{minor}.{patch:02d}")
          code = major * 10_000_000 + minor * 100_000 + patch * 1_000
          open("version.properties", "w").write(
              f"major={major}\nminor={minor}\npatch={patch}\nbuild=0\n")
          print(f"versionName={name}")
          print(f"versionCode={code}")
          EOF
          echo "TGA_VER=$(grep versionName /tmp/bump.txt | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "TGA_CODE=$(grep versionCode /tmp/bump.txt | cut -d= -f2)" >> "$GITHUB_ENV"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Build APK (release)
        run: bash scripts/build_frontend.sh android --extra "--release" --extra "--target-platform" --extra "android-arm64" --extra "--dart-define=TANGRAM_VERSION=$TGA_VER"
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Build AAB
        continue-on-error: true
        run: cd frontend && flutter build appbundle --release --target-platform android-arm64 --dart-define=TANGRAM_VERSION=$TGA_VER
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: 签名校验与发布记录
        run: |
          set -euo pipefail
          APK=$(find frontend/build -name 'app-release.apk' | head -1)
          AH="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          # 先落盘再截断：避免 pipefail 下 head 关闭管道引发 SIGPIPE(141) 误杀构建
          # build-tools 可能有多个版本目录：glob 展开成多路径会被当成参数，取最新版
          BT=$(ls -d "$AH"/build-tools/*/ | sort -V | tail -1)
          "$BT"apksigner verify --print-certs "$APK" > /tmp/sig.txt
          head -8 /tmp/sig.txt
          "$BT"aapt dump badging "$APK" > /tmp/badge.txt
          head -1 /tmp/badge.txt
          echo "versionName=$TGA_VER versionCode=$TGA_CODE 构建时间=$(date -u +%FT%TZ)" | tee frontend/build/APK_VERSION.txt
          sha256sum "$APK" | tee -a frontend/build/APK_VERSION.txt
      - name: Collect(最终产物六文件之 Android .apk)
        run: |
          set -euo pipefail
          mkdir -p out
          APK=$(find frontend/build/app/outputs -name 'app-release.apk' -not -path '*intermediary*' | head -1)
          [ -n "$APK" ] || APK=$(find frontend/build -name 'app-release.apk' -not -path '*intermediary*' | head -1)
          cp -f "$APK" out/tangram-android-arm64.apk
          cp frontend/build/APK_VERSION.txt out/ || true
          ls -l out
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*, if-no-files-found: error }

  # ================= Windows =================
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Install Flutter 3.50.0 (镜像直装)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dst = 'C:\flutter'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          curl.exe -fsSL --retry 5 --retry-all-errors -o "$env:TEMP\f.zip" `
            https://storage.flutter-io.cn/flutter_infra_release/releases/stable/windows/flutter_windows_3.50.0-stable.zip
          Expand-Archive -Path "$env:TEMP\f.zip" -DestinationPath 'C:\' -Force
          echo 'C:\flutter\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & 'C:\flutter\bin\flutter.bat' --version
      - name: Python 构建依赖 (pillow)
        shell: pwsh
        run: python -m pip install --quiet --upgrade pillow
      - name: Build Windows x64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nexec python "$@"\n' > "$HOME/bin/python3"
          chmod +x "$HOME/bin/python3"
          export PATH="$HOME/bin:$PATH"
          python3 --version
          bash scripts/build_frontend.sh windows --extra "--release"
      - name: 单文件便携 exe（IExpress 自解压,双击即运行,同一把安卓密钥签名）
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $b = "frontend/build/windows/x64/runner/Release"
          if (-not (Test-Path "$b/tangram.exe")) { Get-ChildItem -Recurse frontend/build | Select-Object -First 40 FullName; exit 1 }
          Compress-Archive -Path "$b/*" -DestinationPath tangram-payload.zip -Force
          # 首次双击解压到 %LOCALAPPDATA%\tangram 并运行;之后秒开(已存在则跳过解压)
          $bat = @(
            '@echo off',
            'set DEST=%LOCALAPPDATA%\tangram',
            'if not exist "%DEST%\tangram.exe" powershell -NoProfile -Command "Expand-Archive -LiteralPath ''%~dp0tangram-payload.zip'' -DestinationPath ''%DEST%'' -Force"',
            'start "" "%DEST%\tangram.exe"',
            'exit /b 0'
          )
          Set-Content -Path run.bat -Value $bat -Encoding ASCII
          $sed = @(
            '[Version]',
            'Version=1.0',
            'Setup=1',
            '[Options]',
            'PackageName=TGA tangram-agent',
            "TargetName=$PWD\out\tangram-windows-x64.exe",
            'AppLaunched=run.bat',
            'SecurityLevel=1',
            'Compression=1',
            'ShowInstallUI=false',
            'ShowBeginPrompt=false',
            'ShowCopyrightDialog=false',
            'AllowAppSourceFiles=false',
            'RebootIfNeeded=false',
            '[SourceFiles]',
            '1=run.bat',
            '2=tangram-payload.zip'
          )
          Set-Content -Path tangram.sed -Value $sed -Encoding ASCII
          & "$env:WINDIR\System32\iexpress.exe" /N tangram.sed
          if (-not (Test-Path out\tangram-windows-x64.exe)) { Write-Host 'IExpress 未产出 exe'; exit 1 }
          if ($env:ANDROID_KEYSTORE_BASE64) {
            [IO.File]::WriteAllBytes("$env:TEMP\t.jks", [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
            & keytool -importkeystore -srckeystore "$env:TEMP\t.jks" -srcstorepass $env:STORE_PASSWORD -srcalias tangram -destkeystore "$env:TEMP\t.p12" -deststoretype PKCS12 -deststorepass $env:STORE_PASSWORD -noprompt
            $st = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64' } | Select-Object -Last 1
            if (-not $st) { $st = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source }
            if ($st) {
              & $st sign /f "$env:TEMP\t.p12" /p $env:STORE_PASSWORD /fd SHA384 /d "TGA tangram-agent" out\tangram-windows-x64.exe
              & $st verify /pa out\tangram-windows-x64.exe 2>&1 | Select-Object -Last 3
            } else { Write-Host 'signtool 不可用,exe 未签名' }
          }
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with: { name: windows-x64, path: out/*, if-no-files-found: error }

  # ================= Linux =================
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Linux 构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev
      - name: Install Flutter 3.50.0 (镜像直装)
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/flutter && sudo chown "$USER" /opt/flutter
          curl -fL -C - --max-time 600 --retry 5 --retry-all-errors -o /tmp/f.tar.xz \
            https://storage.flutter-io.cn/flutter_infra_release/releases/stable/linux/flutter_linux_3.50.0-stable.tar.xz
          tar -xJf /tmp/f.tar.xz -C /opt/flutter --strip-components=1
          echo /opt/flutter/bin >> "$GITHUB_PATH"
          /opt/flutter/bin/flutter --version
      - name: Python 构建依赖 (pillow)
        run: |
          python3 -m pip install --quiet --upgrade pillow || python3 -m pip install --quiet --break-system-packages pillow
      - name: 移除 hooks（桌面端不打包 Android 预编译库）
        run: |
          cp frontend/pubspec.yaml /tmp/pubspec.yaml.bak
          python3 -c "p='frontend/pubspec.yaml'; s=open(p,encoding='utf-8').read(); i=s.find(chr(10)+'hooks:'); open(p,'w',encoding='utf-8').write(s[:i] if i>0 else s); print('hooks removed:', i>0)"
      - name: Build Linux x64
        run: |
          set -euo pipefail
          cd frontend
          # json.hpp 在新 clang 下 -Werror(deprecated literal operator)：
          # 必须把 operator "" _json 整体收紧为 operator""_json 才真正消除告警
          /opt/flutter/bin/flutter pub get || true
          JH=$(find "$HOME/.pub-cache" -name json.hpp -path '*flutter_secure_storage*' 2>/dev/null | head -1 || true)
          if [ -n "$JH" ]; then
            sed -i 's/operator[[:space:]]*""[[:space:]]*_json_pointer/operator""_json_pointer/g; s/operator[[:space:]]*""[[:space:]]*_json/operator""_json/g' "$JH"
            echo "patched: $JH"
          else
            echo "WARN: json.hpp not found"
          fi
          cd ..
          bash scripts/build_frontend.sh linux --extra "--release"
      - name: Package(最终产物六文件之 Linux .AppImage 单文件)
        run: |
          set -euo pipefail
          mkdir -p out
          B=frontend/build/linux/x64/release/bundle
          [ -f "$B/tangram" ] || { echo "未找到 tangram 可执行文件"; ls -R frontend/build/linux 2>/dev/null | head -30; exit 1; }
          AD=AppDir; rm -rf "$AD"; mkdir -p "$AD"
          cp -a "$B/." "$AD/"
          cp frontend/assets/logo/tangram_deer_192.png "$AD/tangram.png"
          printf '[Desktop Entry]\nType=Application\nName=TGA tangram-agent\nComment=七域合一 Agent 工作站\nExec=tangram\nIcon=tangram\nTerminal=false\nCategories=Utility;\n' > "$AD/tangram.desktop"
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/tangram" "$@"\n' > "$AD/AppRun"
          chmod +x "$AD/AppRun"
          curl -fL --retry 3 -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 /tmp/appimagetool "$AD" out/tangram-linux-x64.AppImage
          ls -l out
      - uses: actions/upload-artifact@v4
        with: { name: linux-x64, path: out/*, if-no-files-found: error }

  # ================= macOS =================
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter 3.50.0 (镜像直装)
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/f.zip \
            https://storage.flutter-io.cn/flutter_infra_release/releases/stable/macos/flutter_macos_3.50.0-stable.zip
          mkdir -p "$HOME/flutter-sdk"
          unzip -q /tmp/f.zip -d "$HOME/flutter-sdk"
          echo "$HOME/flutter-sdk/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter-sdk/flutter/bin/flutter" --version
      - name: Python 构建依赖 (pillow)
        run: |
          python3 -m pip install --quiet --upgrade pillow || python3 -m pip install --quiet --break-system-packages pillow
      - name: 移除 hooks（桌面端不打包 Android 预编译库）
        run: |
          cp frontend/pubspec.yaml /tmp/pubspec.yaml.bak
          python3 -c "import re; p='frontend/pubspec.yaml'; s=open(p,encoding='utf-8').read(); i=s.find(chr(10)+'hooks:'); open(p,'w',encoding='utf-8').write(s[:i] if i>0 else s); print('hooks removed:', i>0)"
          tail -3 frontend/pubspec.yaml
      - name: Build macOS (host arch, 未签名)
        run: bash scripts/build_frontend.sh macos --extra "--release"
      - name: Package(最终产物六文件之 macOS .dmg)
        run: |
          set -euo pipefail
          mkdir -p out
          APP=$(find frontend/build/macos -name "tangram.app" -maxdepth 6 | head -1)
          [ -n "$APP" ] || { echo "未找到 tangram.app"; exit 1; }
          codesign --force --deep --sign - "$APP" 2>/dev/null || true
          STAGE=$(mktemp -d)
          cp -a "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "TGA tangram-agent" -srcfolder "$STAGE" -ov -format UDZO "out/tangram-macos-$(uname -m).dmg"
          rm -rf "$STAGE"
          ls -l out
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: out/*, if-no-files-found: error }

  # ================= iOS =================
  # 未签名 ipa:CI 无苹果开发者证书,产物为 --no-codesign 包,供自行签名
  # (Xcode/esign)或开发者设备安装;发布说明中如实标注。
  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter 3.50.0 (镜像直装)
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/f.zip \
            https://storage.flutter-io.cn/flutter_infra_release/releases/stable/macos/flutter_macos_3.50.0-stable.zip
          mkdir -p "$HOME/flutter-sdk"
          unzip -q /tmp/f.zip -d "$HOME/flutter-sdk"
          echo "$HOME/flutter-sdk/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter-sdk/flutter/bin/flutter" --version
      - name: Python 构建依赖 (pillow)
        run: |
          python3 -m pip install --quiet --upgrade pillow || python3 -m pip install --quiet --break-system-packages pillow
      - name: 移除 hooks（iOS 不打包 Android 预编译库）
        run: |
          python3 -c "p='frontend/pubspec.yaml'; s=open(p,encoding='utf-8').read(); i=s.find(chr(10)+'hooks:'); open(p,'w',encoding='utf-8').write(s[:i] if i>0 else s); print('hooks removed:', i>0)"
      - name: Build iOS (release, 未签名)
        run: |
          set -euo pipefail
          cd frontend
          [ -d ios ] || flutter create --platforms=ios --project-name tangram .
          flutter pub get
          flutter build ios --release --no-codesign
      - name: Package ipa
        run: |
          set -euo pipefail
          mkdir -p out/payload/Payload
          APP=$(find frontend/build/ios/iphone -maxdepth 1 -name 'Runner.app' | head -1)
          [ -n "$APP" ] || { echo "未找到 Runner.app"; find frontend/build/ios -maxdepth 3 | head -30; exit 1; }
          cp -a "$APP" out/payload/Payload/tangram.app
          (cd out/payload && zip -qr ../tangram-ios-arm64-unsigned.ipa Payload)
          ls -l out
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: out/tangram-ios-arm64-unsigned.ipa, if-no-files-found: error }

  # ================= HarmonyOS =================
  # OpenHarmony 版 Flutter(ohos 分支)+ 官方 SDK(华为云镜像)尽力构建 hap。
  # 注:ohos Flutter 目前最高 3.22.1(Dart 3.4),与本项目 Dart 3.10 API 存在
  # 代差,构建可能失败;失败不阻塞其余平台发布(continue-on-error)。
  harmonyos:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: ohos Flutter SDK(OpenHarmony SIG 官方分支)
        run: |
          set -euo pipefail
          git clone --depth 1 -b 3.22.1-ohos-0.1.0 https://gitee.com/openharmony-sig/flutter_flutter /opt/ohos-flutter
          git -C /opt/ohos-flutter config --global --add safe.directory /opt/ohos-flutter || true
          # 镜像引擎产物,避免 CI 拉 Google 存储超时
          export FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn
          /opt/ohos-flutter/bin/flutter --version
      - name: OpenHarmony 5.0.0 SDK(华为云公开镜像)
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/ohos-sdk.tar.gz \
            https://repo.huaweicloud.com/openharmony/os/5.0.0-Release/ohos-sdk-windows_linux-public.tar.gz
          mkdir -p /tmp/ohos-sdk && tar -xf /tmp/ohos-sdk.tar.gz -C /tmp/ohos-sdk
          mkdir -p "$HOME/ohos-sdk/linux"
          find /tmp/ohos-sdk -name '*-linux-x64-*.zip' -exec unzip -q {} -d "$HOME/ohos-sdk/linux" \;
          ls "$HOME/ohos-sdk/linux" | head
          echo "OHOS_SDK_HOME=$HOME/ohos-sdk/linux" >> "$GITHUB_ENV"
      - name: Build HAP
        run: |
          set -euo pipefail
          cd frontend
          # ohos Flutter 为 Dart 3.4:临时放宽约束(仅 CI,不落库)
          sed -i "s/sdk: '>=3.10.7 <4.0.0'/sdk: '>=3.4.0 <4.0.0'/" pubspec.yaml
          sed -i "s/flutter: '>=3.10.0/flutter: '>=3.22.0/" pubspec.yaml || true
          /opt/ohos-flutter/bin/flutter config --enable-ohos
          [ -d ohos ] || /opt/ohos-flutter/bin/flutter create --platforms=ohos --project-name tangram .
          /opt/ohos-flutter/bin/flutter pub get
          /opt/ohos-flutter/bin/flutter build hap --release
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p out
          HAP=$(find frontend/build/ohos -name '*.hap' | head -1)
          [ -n "$HAP" ] || { echo "未找到 hap"; exit 1; }
          cp "$HAP" out/tangram-harmonyos.hap
          ls -l out
      - uses: actions/upload-artifact@v4
        with: { name: harmonyos, path: out/tangram-harmonyos.hap, if-no-files-found: warn }

  # ================= Release =================
  release:
    needs: [android, windows, linux, macos, ios, harmonyos]
    if: ${{ (github.event_name == 'push' || inputs.make_release) && needs.android.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.macos.result == 'success' && needs.ios.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: List
        run: find dist -type f -printf '%s %p\n' | sort -rn
      - name: 读取版本（OTA 标签真源 = android 构建的 version.properties）
        run: |
          V=$(grep -o 'versionName=[0-9.]*' dist/android/APK_VERSION.txt | cut -d= -f2)
          [ -n "$V" ] || V=$(tr -d '[:space:]' < VERSION)
          echo "TGA_VER=$V" >> "$GITHUB_ENV"
      - name: 只保留六个安装包（清掉版本说明等辅助文件）
        run: |
          set -euo pipefail
          find dist -type f ! -name '*.apk' ! -name '*.exe' ! -name '*.AppImage' ! -name '*.appimage' ! -name '*.dmg' ! -name '*.ipa' ! -name '*.hap' -delete
          find dist -type d -empty -delete || true
          echo "== 最终产物 =="; find dist -type f | sort
      - name: Publish Release（发布通道仓库，公开仅产物；源码仓库保持私有）
        uses: softprops/action-gh-release@v2
        with:
          repository: 3477856804/tangram-agent-releases
          token: ${{ secrets.RELEASE_PAT }}
          tag_name: v${{ env.TGA_VER }}
          name: TGA tangram-agent v${{ env.TGA_VER }}（CI 全平台）
          body: |
            由 GitHub Actions 自动构建（commit ${{ github.sha }}）。
            最终产物恰好六个安装包：
            - Windows：tangram-windows-x64.exe（单文件便携版，双击即运行免安装，已用安卓发布同一把 RSA 私钥 Authenticode 自签名）
            - macOS：tangram-macos-arm64.dmg（ad-hoc 签名，首跑需右键打开放行）
            - Linux：tangram-linux-x64.AppImage（单文件，chmod +x 后双击即运行）
            - Android：tangram-android-arm64.apk（keystore 正式签名，OTA 覆盖安装）
            - iOS：tangram-ios-arm64-unsigned.ipa（CI 无苹果开发者证书，需自行签名安装）
            - HarmonyOS：tangram-harmonyos.hap（尽力构建；ohos Flutter 与本项目存在代差，可能缺席）
            全部安装包完整性由下方 SHA256 清单 + 安卓发布同一把 RSA 私钥的签名保证（App 内 OTA 自动校验）。本仓库仅含安装包，不含源码。
          files: dist/**/*
          fail_on_unmatched_files: false
      - name: 用安卓发布私钥签名产物校验清单,写入 Release 正文（产物保持恰好 6 个文件）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "无密钥,跳过"; exit 0; }
          sudo apt-get update -qq && sudo apt-get install -y -qq openjdk-21-jre-headless >/dev/null
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/t.jks
          keytool -importkeystore -srckeystore /tmp/t.jks -srcstorepass "$STORE_PASSWORD" -srcalias tangram -destkeystore /tmp/t.p12 -deststoretype PKCS12 -deststorepass "$STORE_PASSWORD" -noprompt
          openssl pkcs12 -in /tmp/t.p12 -passin pass:"$STORE_PASSWORD" -nokeys -clcerts -out /tmp/cert.pem
          openssl pkcs12 -in /tmp/t.p12 -passin pass:"$STORE_PASSWORD" -nocerts -nodes -out /tmp/key.pem
          (cd dist && find . -type f -exec sha256sum {} \; | sed 's|\./||' | sort) > /tmp/sums.txt
          SIG=$(openssl dgst -sha256 -sign /tmp/key.pem -out /dev/stdout /tmp/sums.txt | base64 -w0)
          FP=$(openssl x509 -in /tmp/cert.pem -noout -fingerprint -sha256 | cut -d= -f2)
          RID=$(curl -s -H "Authorization: Bearer $RELEASE_PAT" "https://api.github.com/repos/3477856804/tangram-agent-releases/releases/tags/v${TGA_VER}" | jq -r .id)
          BODY=$(curl -s -H "Authorization: Bearer $RELEASE_PAT" "https://api.github.com/repos/3477856804/tangram-agent-releases/releases/$RID" | jq -r .body)
          { echo "$BODY"; echo; echo '## 产物校验（SHA256 + 安卓发布私钥 RSA-SHA256 签名）'; echo; echo '```'; cat /tmp/sums.txt; echo '```'; echo; echo "签名(base64): $SIG"; echo "证书指纹(SHA256): $FP"; } > /tmp/newbody.json
          jq -Rs '{body:.}' /tmp/newbody.json > /tmp/payload.json
          curl -s -X PATCH -H "Authorization: Bearer $RELEASE_PAT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/3477856804/tangram-agent-releases/releases/$RID" -d @/tmp/payload.json -o /dev/null -w "body 更新: %{http_code}\n"
