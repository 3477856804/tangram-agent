# 沙箱 cgroup 内存上限为 8 GiB；Gradle + Kotlin 编译 daemon 各自 -Xmx8G 会触发
# 内核 OOM killer（日志表现为 "Gradle build daemon disappeared unexpectedly"）。
# 因此把总堆压到 3 GiB，并让 Kotlin 编译在 Gradle 进程内执行，不再另起 8G JVM。
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
# 依赖已随仓库缓存；避免 Gradle 在 google() 元数据检查上无上限等待，
# 网络不可达时快速回退本地缓存，保证离线可复现构建。
org.gradle.internal.http.connectionTimeout=15000
org.gradle.internal.http.socketTimeout=15000

# 国内网络构建提示：Flutter 引擎 artifact 默认从 storage.googleapis.com
# 拉取，常不可达导致 assembleRelease 挂起。构建前设置环境变量
#   FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn
# 走国内镜像即可（gradle 插件会读取该变量）。
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvm.options=-Xmx1G,-XX:MaxMetaspaceSize=512m
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
